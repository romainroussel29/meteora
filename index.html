<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Meteora – Météo en temps réel, heure par heure et radar de pluie</title>
    <meta name="description" content="Meteora : la météo en temps réel pour toutes les villes du monde. Prévisions heure par heure et sur 7 jours, radar de pluie, vent, alerte pluie et villes favorites. Gratuit, installable sur iPhone et Android." />
    <meta name="author" content="Romain Roussel" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Référencement : adresse officielle de la page (évite les doublons comme ?meteo=pluie) -->
    <link rel="canonical" href="https://meteora13.vercel.app/" />

    <!-- Aperçu lors d'un partage (LinkedIn, WhatsApp, Facebook, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Meteora" />
    <meta property="og:url" content="https://meteora13.vercel.app/" />
    <meta property="og:title" content="Meteora – Météo en temps réel" />
    <meta property="og:description" content="Prévisions heure par heure et sur 7 jours, radar de pluie, vent et favoris. Gratuit, installable sur iPhone et Android." />
    <meta property="og:image" content="https://meteora13.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aperçu de l'application météo Meteora" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meteora – Météo en temps réel" />
    <meta name="twitter:description" content="Prévisions heure par heure et sur 7 jours, radar de pluie, vent et favoris." />
    <meta name="twitter:image" content="https://meteora13.vercel.app/og-image.png" />

    <!-- Données structurées : indique à Google qu'il s'agit d'une application web météo -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Meteora",
        "url": "https://meteora13.vercel.app/",
        "description": "Météo en temps réel : prévisions heure par heure et sur 7 jours, radar de pluie, vent et villes favorites.",
        "applicationCategory": "WeatherApplication",
        "operatingSystem": "Tous (navigateur web, iOS, Android)",
        "inLanguage": "fr",
        "image": "https://meteora13.vercel.app/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "author": { "@type": "Person", "name": "Romain Roussel", "url": "https://github.com/romainroussel29" }
      }
    </script>

    <!-- Icônes et PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS : ouverture en plein écran depuis l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meteora" />
  </head>
  <body class="bg-slate-900">
    <div id="root"></div>
    <!-- Contenu lisible sans JavaScript (moteurs de recherche, aperçus) ; remplacé par l'application au chargement -->
    <noscript>
      <h1>Meteora – Météo en temps réel</h1>
      <p>Prévisions heure par heure et sur 7 jours, radar de pluie, vent et villes favorites. Activez JavaScript pour utiliser l'application.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
